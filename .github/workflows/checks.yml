name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: the webserver imports it. `bundle` writes it
      # (swagger.json + VERSION + embedded.go) and is the same step the image
      # build runs. Needs swag only — the TypeScript client that used to be
      # bundled in here lives on npm now, so there is no Node step.
      - name: Generate embedded docs
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      #
      # The tests start the real application against a PowerDNS container, so
      # they need three things a clean checkout cannot supply on its own:
      #
      #   - a REAL OIDC issuer, because startup fetches its discovery document
      #     and gives up if that fails. sso.dhbw.cloud is public and only read.
      #   - the upstream announcement's zone and name, which configuration
      #     validation insists on even when no upstream is configured (without
      #     one TestUpstreamDnsUpdate skips itself).
      #   - the PowerDNS image, because TestContainerLifecycle creates a
      #     container without pulling first.
      #
      # Everything else the fixture now sets itself (internal/test_helpers.go).
      - name: Tests
        if: '!cancelled()'
        env:
          OIDC_ISSUER_URL: https://sso.dhbw.cloud/realms/dhbw-main
          OIDC_CLIENT_ID: dhbw-cloud-dns
          UPSTREAM_DNS_ZONE: example.test.
          UPSTREAM_DNS_NAME: ns
        run: |
          docker pull powerdns/pdns-auth-master:latest
          make test
