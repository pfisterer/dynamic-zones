name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: internal/webserver imports it. `bundle` is what
      # writes it (swagger.json + the TS client + embedded.go) and is the same
      # step the image build runs.
      - name: Generate embedded docs and client
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      #
      # NO test step here yet, unlike the sibling services — and that is a
      # statement about the tests, not about this workflow.
      #
      # They are integration tests that start the real application against a
      # PowerDNS container, and they are wired to a developer's gitignored
      # .env: a clean checkout dies first on missing required configuration,
      # then on a placeholder OIDC issuer (startup fetches the discovery
      # document), then on absent dummy policy data, and TestUpstreamDnsUpdate
      # wants a real upstream TSIG key — which is a secret and has no business
      # in a public workflow. Two of them also idle for 61 s and time out.
      #
      # Getting there is a job on the test suite (see d8 in the deployment
      # repo's TODOs). Until then `go vet` type-checks the whole module on
      # every push, which is more than this repo had before.
