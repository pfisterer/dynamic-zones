---
# Dependency condition of the cloud-self-service umbrella chart, which decides by
# this key whether to install this chart at all. Set it there, not here: a
# standalone `helm install` of this chart ignores it entirely.
enabled: true

#------------------------------------
# Dynamic Zones API Configuration
#------------------------------------
dynamicZonesAPI:
  image: ghcr.io/pfisterer/dynamic-zones
  imagePullPolicy: Always
  # Empty -> the chart's appVersion is used (see the deployment template).
  version: ""
  hostname: "dyndnsapi.example.com"
  replicas: 1

  # Name of an existing Secret providing the keys `db-connection-string`,
  # `pdns-api-key`, `upstream-tsig-secret` and `zone-admin-tsig-key`. When set,
  # the chart does NOT create its own Secret and the corresponding secret values
  # below (database.password/connectionString, powerDNS.apiKey,
  # upstreamDNS.tsigSecret, zoneDefaults.defaultAdminTsigKey) are ignored.
  existingSecret: ""

  # Upstream DNS. name+zone are the nameserver identity (also the SOA/NS of
  # created zones) and are always required. The periodic RFC2136 updater runs
  # ONLY when a TSIG key (tsigName/tsigAlgorithm/tsigSecret) is configured; leave
  # TSIG empty (e.g. on staging) to keep an environment from writing upstream.
  upstreamDNS:
    server: ns.example.de
    port: 53
    tsigName: cloud-ns.example.de
    tsigAlgorithm: hmac-sha256
    tsigSecret: some-base64-secret
    zone: cloud-ns.example.de
    name: ns
    ttl: 60
    updateInterval: 300

  # General Configuration
  apiMode: production
  # Browser origins allowed to call /v1 cross-origin, as full origins
  # ("https://selfservice.example.cloud"). Empty = no cross-origin access, which
  # is right when the SPA reaches this API same-origin through a BFF/reverse
  # proxy. dyndns clients are not browsers and are unaffected either way.
  corsAllowedOrigins: []
  initialDataProviderScript: ""
  # Lifetime of an API token when the request does not ask for one, and the
  # longest one a caller may ask for. A request over the maximum is refused
  # rather than shortened: a token that stops working earlier than the person was
  # told is an outage nobody connects to the moment they created it.
  apiTokenTtlHours: 8760 # 1 year
  apiTokenMaxTtlHours: 8760
  # Whether a token may be issued with no expiry at all. On here, unlike in
  # openstack-management-api: the typical token for this API sits in a home
  # router or a cron job, where an expiry nobody is reminded of surfaces months
  # later as DNS that quietly stopped updating. Revoking is one click; noticing
  # is the hard part.
  apiTokenAllowNeverExpires: true
  apiBindString: "" # Optional
  apiBaseUrl: "" # Will default to https://<hostname>

  # Database configuration for this API
  database:
    type: postgres
    name: dynamic_zones
    username: dynamic_zones
    password: changeme
    hostname: your-postgres-host

  # DNS Policy Configuration
  dnsPolicy:
    superAdminEmails:
      - your_mail@example.com
      - second_mail@example.com

  # Zone Defaults
  zoneDefaults:
    defaultAdminTsigKeyName: ""
    defaultAdminTsigKey: ""
    defaultAdminTsigAlg: ""
    # JSON list of records added to each new user (leaf) zone.
    defaultRecords: ""
    # JSON list of records added ONLY to SOA/base (intermediate) zones — e.g. the
    # enforced CAA — kept out of leaf zones so a user cannot delete/override it.
    defaultRecordsSoa: ""

#------------------------------------
# OIDC/Auth Configuration
#------------------------------------
auth:
  oidc:
    issuerUrl: https://sso.example.cloud/realms/example
    clientId: example-cloud-dns

#------------------------------------
# PowerDNS Configuration
#------------------------------------
powerDNS:
  apiKey: my-api-key
  apiUrl: http://localhost:8080
  vhost: localhost
  logLevel: 7
  # Server configuration
  server:
    # PUBLIC endpoint of this nameserver: announced upstream as its A/AAAA
    # record and used to build the dig / cert-manager / external-dns examples.
    # Must be an address that works from outside the cluster.
    ip: "141.1.2.3"
    port: 53
    # Optional public NS hostname (e.g. ns.cloud-ns.dhbw-mannheim.de.) shown to
    # users in the examples instead of the bare IP. Empty -> examples use `ip`.
    advertisedNameserver: ""
    # Where the API sends its OWN zone transfers and RFC 2136 updates. Only has
    # to resolve from inside the cluster, so it is the PowerDNS Service — a name,
    # re-resolved on every connection. Keeping this separate from `ip` is what
    # stops that traffic from leaving via the public address and coming back in
    # through dnsdist.
    queryTarget: "pdns-dns:53"

#------------------------------------
# Ingress Configuration
#------------------------------------
ingress:
  enabled: true
  # Empty className -> field omitted -> cluster default IngressClass (Traefik on
  # k3s). No cert-manager annotation: TLS = cluster wildcard default cert.
  className: ""
  annotations: {}
